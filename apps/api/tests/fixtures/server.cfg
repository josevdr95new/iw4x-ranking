// ============================================================
// Servidor dedicado IW4x — FIXTURE de tests (estilo cfg oficial)
// ============================================================

// --- Logging de partidas ---
seta logfile "2"                                 // Enable loging 1-2? enable. 0 disable.
seta g_logSync "1"                               // 1 always flush games_mp.log
seta g_log "logs/games_mp.log"                   // Gamelog filename.

// --- Identidad del servidor ---
set sv_hostname "^7[^1RANKING^7] ^7Test Fixture"        // Sets the server hostname
set sv_motd "Bienvenidos al ranking"             // Sets a custom motd
seta sv_maxclients "12"
seta scr_testclients "4"
set rcon_password "secreto-12345"                // Access to your server
set g_password ""                                // Password Protected Server

// --- Dvars no gestionadas por el panel (deben quedar intactas) ---
set sv_securityLevel "23"
set g_inactivity "300"
seta custom_thing "abc"

// --- Modo de juego ---
seta g_gametype "war"

addGametype war
addMap mp_rust
addMap mp_terminal
addGametype dm
addMap mp_shipment

map_rotate
